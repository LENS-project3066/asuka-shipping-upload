<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5S安全パトロール</title>
<style>
  /* ── デザイントークン（抑制的モダン: 太字回避=weight≤500 / 角丸控えめ=4px中心） ── */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --ink: #1d2128;
    --muted: #6c727c;
    --faint: #9aa0aa;
    --line: #e7e8ec;
    --line-2: #dcdee3;
    --accent: #4b5bd0;          /* 新規系の落ち着いたインディゴ */
    --accent-ink: #3f4cb5;
    --accent-weak: #eef0fb;
    --accent-line: #d6daf3;
    --violet: #7558b8;          /* フォロー系のミュートしたバイオレット */
    --violet-weak: #f2edf8;
    --danger: #d64545;
    --danger-weak: #fbecec;
    --danger-line: #ecc4c4;
    --ok: #2f9e5f;
    --ok-weak: #e8f5ee;
    --amber: #c2680f;
    --r: 4px;                   /* コントロール標準 */
    --r-card: 6px;              /* カード・面 */
    --shadow-sm: 0 1px 2px rgba(20,22,28,0.08);
    --shadow-pop: 0 6px 22px rgba(15,17,22,0.20);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    line-height: 1.5; letter-spacing: -0.003em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .container { max-width: 440px; margin: 0 auto; padding: 20px 16px 16px; }
  /* 送信待ちバナーは position:fixed で画面下に居座るので、出ている間だけ下に逃げ場を作る。
     ⚠⚠ これが無いと **バナーが一番下のボタン(=送信)を覆って押せなくなる**。
     送信待ちが溜まっているときほど押せなくなる = 一番困る場面で詰む(2026-09-05 現場で発生)。

     ⚠⚠ **値は実行時にバナーの実高さから入れる**(`--queue-pad`)。
     ⛔ 固定値に戻さないこと ── 初版は 108px 固定で、同じコミットで 3 つ目のボタンを
     足したせいで警告状態だとテキストが折り返してバナーが 130px 級に伸び、
     **直したはずの「送信ボタンが覆われる」が部分再発していた**
     (2026-09-05 クロスレビュー M-1・肯定/否定の両レビュアーが独立に指摘)。
     ここの既定値は JS が動かなかったときの保険。 */
  body.has-queue .container { padding-bottom: var(--queue-pad, 160px); }
  h1 { font-size: 19px; text-align: center; margin-bottom: 3px; font-weight: 500; letter-spacing: -0.01em; }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.01em; }
  .form-select,
  .form-textarea,
  .form-input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: var(--r);
    font-size: 15px; background: var(--surface); color: var(--ink); font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-textarea { min-height: 84px; resize: vertical; }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--faint); }
  .form-select:focus, .form-textarea:focus, .form-input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak);
  }

  .btn {
    padding: 12px 8px; border: none; border-radius: var(--r); font-size: 15px;
    font-weight: 500; cursor: pointer; text-align: center;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .btn-camera { flex: 1; background: var(--accent); color: #fff; }
  .btn-camera:active { background: var(--accent-ink); }
  .btn-gallery { flex: 1; background: var(--surface); color: var(--accent); border: 1px solid var(--accent-line); }
  .btn-gallery:active { background: var(--accent-weak); }
  input[type="file"] { display: none; }

  .photo-btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .photo-preview {
    width: 100%; aspect-ratio: 4/3; border: 1px dashed var(--line-2); border-radius: var(--r-card);
    display: flex; align-items: center; justify-content: center; color: var(--faint);
    font-size: 13px; overflow: hidden; position: relative; background: #fbfbfc;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-remove {
    position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
    background: rgba(20,22,28,0.62); color: #fff; border: none; border-radius: 50%;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }

  .btn-send {
    display: block; width: 100%; padding: 14px; background: var(--ink); color: #fff;
    border: none; border-radius: var(--r); font-size: 15px; font-weight: 500;
    letter-spacing: 0.01em; cursor: pointer; margin-top: 10px; transition: background 0.15s;
  }
  .btn-send:active { background: #2c313d; }
  .btn-send:disabled { background: #cdd0d6; color: #fff; cursor: not-allowed; }

  .status { text-align: center; padding: 11px; font-size: 13.5px; font-weight: 500; border-radius: var(--r); margin-bottom: 12px; }
  .status-success { background: var(--ok-weak); color: var(--ok); }
  .status-error { background: var(--danger-weak); color: var(--danger); }
  .status-uploading { background: var(--accent-weak); color: var(--accent); }
  .hidden { display: none; }

  .counter { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  .location-chip { display: inline-block; padding: 4px 10px; background: var(--accent-weak); color: var(--accent); border-radius: var(--r); font-size: 12px; font-weight: 500; }
  .location-change { color: var(--muted); font-size: 12px; cursor: pointer; margin-left: 10px; text-decoration: underline; text-underline-offset: 2px; }
  .location-change:active { color: var(--accent); }

  /* タブ（セグメンテッドコントロール） */
  .tab-bar {
    display: flex; gap: 3px; margin-bottom: 18px; border-radius: var(--r-card);
    background: #ebedf0; padding: 3px;
  }
  .tab-btn {
    flex: 1; padding: 9px 0; border: none; font-size: 14px; font-weight: 500;
    cursor: pointer; text-align: center; transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    background: transparent; color: var(--muted); border-radius: var(--r);
  }
  .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .tab-btn:not(.active):active { color: var(--ink); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* フォロー: 指摘カード（状態間で枠を 1px 固定しレイアウトを揺らさない） */
  .finding-card {
    position: relative;
    display: flex; gap: 12px; padding: 12px; margin-bottom: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); cursor: pointer;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .finding-card:active { background: #f6f7f9; }
  .finding-card.selected { border-color: var(--violet); background: var(--violet-weak); box-shadow: 0 0 0 1px var(--violet); }
  /* 完了カード: 閲覧は可能（タップで Before/After を確認できる）。
     色の薄化で完了状態を視覚的に表現。 */
  .finding-card.done { border-color: var(--line); background: #f8f9fa; }
  .finding-card.done .finding-thumb { opacity: 0.5; }
  .finding-card.done .finding-comment { color: var(--faint); }
  .finding-card.done .finding-workplace { color: #a99bc7; }
  .finding-thumb { width: 80px; height: 60px; border-radius: var(--r); object-fit: cover; background: #eef0f2; flex-shrink: 0; }
  .finding-info { flex: 1; min-width: 0; }
  .finding-workplace { font-size: 12px; font-weight: 500; color: var(--violet); margin-bottom: 3px; }
  .finding-comment { font-size: 13px; color: #4b5159; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .finding-date { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .finding-done-badge { font-size: 11px; color: var(--ok); font-weight: 500; }
  /* 取消ボタン: カード右下に絶対配置。カードクリック(閲覧)と区別しやすく赤系で。 */
  .finding-reset-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    padding: 4px 10px;
    font-size: 11px;
    border: 1px solid var(--danger-line);
    border-radius: var(--r);
    background: var(--surface);
    color: var(--danger);
    cursor: pointer;
    font-weight: 500;
  }
  .finding-reset-btn:active { background: var(--danger-weak); }

  /* Before/After 閲覧オーバーレイ */
  .photo-view-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 17, 22, 0.66);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    z-index: 1000;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 20px 12px;
    overflow-y: auto;
  }
  .photo-view-dialog {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 16px 16px 20px;
    max-width: 440px;
    width: 100%;
    position: relative;
    box-shadow: var(--shadow-pop);
  }
  .photo-view-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: #eef0f2;
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
    line-height: 1;
  }
  .photo-view-close:active { background: #dfe2e6; }
  .photo-view-title { font-size: 14px; font-weight: 500; color: var(--violet); padding-right: 40px; }
  .photo-view-date { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .photo-view-comment { font-size: 13px; color: #4b5159; margin-top: 8px; white-space: pre-wrap; }
  .photo-view-label { font-size: 12px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; }
  .photo-view-img { width: 100%; border-radius: var(--r); display: block; }
  .empty-msg { text-align: center; color: var(--faint); font-size: 14px; padding: 40px 0; }

  .follow-form { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 10px; }
  .before-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 5px; }
  .before-photo { width: 100%; border-radius: var(--r-card); margin-bottom: 14px; }

  /* 送信待ちキュー バナー (画面下部固定)。
     楽観 write-behind: 撮影は即フォームをクリアし、裏で直列アップロード。
     その進捗をここに表示する。pending=0 で自動的に隠れる。 */
  .queue-banner {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 14px; width: calc(100% - 24px); max-width: 416px;
    background: #23262e; color: #fff; border-radius: var(--r-card);
    padding: 11px 14px; font-size: 13px; font-weight: 500;
    /* ⚠ ボタンが 3 つ出る状態(警告時)で横が潰れないよう折り返す。⛔ nowrap に戻さないこと ──
       `.qb-retry` は flex-shrink:0 なので、潰れるのは文字側だけになり 5 行に化ける。 */
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: var(--shadow-pop); z-index: 900;
  }
  .idb-warning {
    background: var(--danger-weak); color: var(--danger);
    border: 1px solid var(--danger-line); border-radius: var(--r-card);
    padding: 10px 12px; font-size: 13px; font-weight: 500;
    line-height: 1.5; margin-bottom: 12px;
  }
  .idb-warning.hidden { display: none; }
  .queue-banner.hidden { display: none; }
  .queue-banner.error { background: #b23b3b; }
  .queue-banner.offline { background: #5a5048; }
  /* ⚠ テキストは 1 行目を丸ごと使う(flex-basis:100%)。ボタンは 2 行目へ回るので、
     ボタンが増えても文字が細切れに折り返してバナーが縦に伸びることがない。 */
  .qb-text { flex: 1 1 100%; min-width: 0; }
  .qb-spin {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    border-radius: 50%; animation: qbspin 0.8s linear infinite;
  }
  .qb-spin.hidden { display: none; }
  @keyframes qbspin { to { transform: rotate(360deg); } }
  .qb-retry {
    flex-shrink: 0; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.55);
    border-radius: var(--r); background: transparent; color: #fff;
    font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .qb-retry:active { background: rgba(255,255,255,0.15); }
  .qb-retry.hidden { display: none; }

  /* フォロー: 送信待ち(楽観完了)カード。✓フォロー済みとは別の淡色で区別。 */
  .finding-pending-badge { font-size: 11px; color: var(--amber); font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 5S安全パトロール</h1>
  <p class="subtitle" id="pageSubtitle">指摘登録 & フォロー</p>

  <!-- 端末で IndexedDB(送信待ちの一時保存)が使えない場合の恒久警告 (M-7) -->
  <div class="idb-warning hidden" id="idbWarning">
    ⚠️ この端末では送信待ちの一時保存が使えません（プライベートブラウズ等が原因の可能性）。
    送信に失敗する場合は、通常モードのブラウザで開き直してください。
  </div>

  <!-- 拠点選択画面 -->
  <div id="locationScreen">
    <div class="form-group">
      <label class="form-label">拠点を選択</label>
      <button class="btn btn-camera" style="width:100%; margin-bottom:8px;" data-location="honsha">🏢 本社</button>
      <button class="btn btn-camera" style="width:100%;" data-location="kitahora">🏭 北洞</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="mainScreen" class="hidden">
    <div style="margin-bottom: 12px;">
      <span class="location-chip" id="locationChip">本社</span>
      <a class="location-change" id="changeLocationBtn">拠点を変える</a>
    </div>

    <!-- タブバー -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="follow">🔄 フォロー</button>
      <button class="tab-btn" data-tab="new">📷 新規指摘</button>
    </div>

    <!-- ============================== -->
    <!-- フォロータブ -->
    <!-- ============================== -->
    <div class="tab-content active" id="tabFollow">
      <div class="form-group" style="margin-bottom:10px;">
        <label class="form-label" for="followMonthInput">対象月</label>
        <input type="month" class="form-input" id="followMonthInput">
      </div>
      <div class="finding-list" id="findingList">
        <div class="empty-msg">読み込み中...</div>
      </div>

      <div id="followForm" class="follow-form hidden">
        <div class="before-label">Before写真</div>
        <img class="before-photo" id="beforePhoto" src="" alt="before">

        <div class="photo-area">
          <label class="form-label">After写真 <span style="color:var(--danger);">*</span></label>
          <div class="photo-btn-row">
            <button class="btn btn-camera" id="followCameraBtn">📷 撮影</button>
            <button class="btn btn-gallery" id="followGalleryBtn">🖼 写真を選ぶ</button>
          </div>
          <input type="file" id="followCameraInput" accept="image/*" capture="environment">
          <input type="file" id="followGalleryInput" accept="image/*">
          <div class="photo-preview" id="followPhotoPreview">After写真を撮影または選択</div>
        </div>

        <div class="status hidden" id="followStatus"></div>
        <button class="btn-send" id="followSendBtn" disabled>フォローを送信</button>
      </div>
    </div>

    <!-- ============================== -->
    <!-- 新規指摘タブ -->
    <!-- ============================== -->
    <div class="tab-content" id="tabNew">
      <div class="form-group">
        <label class="form-label">職場 <span style="color:var(--danger);">*</span></label>
        <select class="form-select" id="workplaceSelect">
          <option value="">-- 選択してください --</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">指摘内容 <span style="color:var(--danger);">*</span></label>
        <textarea class="form-textarea" id="commentInput" placeholder="例: 通路に段ボールが積み上げられている"></textarea>
      </div>

      <div class="photo-area">
        <label class="form-label">写真 <span style="color:var(--danger);">*</span></label>
        <div class="photo-btn-row">
          <button class="btn btn-camera" id="newCameraBtn">📷 撮影</button>
          <button class="btn btn-gallery" id="newGalleryBtn">🖼 写真を選ぶ</button>
        </div>
        <input type="file" id="newCameraInput" accept="image/*" capture="environment">
        <input type="file" id="newGalleryInput" accept="image/*">
        <div class="photo-preview" id="newPhotoPreview">写真を撮影または選択</div>
      </div>

      <div class="status hidden" id="newStatus"></div>
      <button class="btn-send" id="newSendBtn" disabled>送信する</button>
      <div class="counter hidden" id="newCounter"></div>
    </div>
  </div>
</div>

<!-- 送信待ちキュー バナー (画面下部固定・pending>0 のとき表示) -->
<div class="queue-banner hidden" id="queueBanner">
  <div class="qb-spin hidden" id="qbSpin"></div>
  <div class="qb-text" id="qbText"></div>
  <!-- ⛔ 並び順を変えないこと: 逃がす手(端末に保存)を、消す手(破棄)より先に見せる。 -->
  <button class="qb-retry hidden" id="qbSave">端末に保存</button>
  <button class="qb-retry hidden" id="qbDiscard">破棄</button>
  <button class="qb-retry hidden" id="qbRetry">今すぐ再送</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  const SUPABASE_URL = 'https://imunxfojosnpoohbkuyd.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdW54Zm9qb3NucG9vaGJrdXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxODAyNzIsImV4cCI6MjA3ODc1NjI3Mn0.5opdeiZ-eAboMERcZKwD3F1K8Mrd8tu7v6D8f41qIS8';
  const BUCKET = 'quality-docs';
  const FOLDER = 'safety-patrol';
  // 写真縮小(M-8): 原寸4000px級の写真を積むと帯域/IndexedDB Quota を圧迫するため、
  // 撮影直後に canvas で縮小してからキューに積む。長辺2048pxあれば A4 印刷でも
  // 十分・画面表示は余裕。quality0.9 は視覚的にほぼ無損失。
  const MAX_EDGE = 2048;
  // ⚠ **寸法(2048)は下げないこと**。PC の指摘ビューアは拡大表示で Storage の**原本を
  //   そのまま**読む(getPublicUrl = object/public・縮小変換なし)ので、寸法を削ると
  //   拡大したときの解像度がそのまま落ちる。細かい不具合や表示ラベルが読めなくなる。
  // ★ 落としてよいのは品質の方。実測(2026-09-05・現場の実写真 1536x2048):
  //   q0.9=652KB / q0.8=462KB(-29%) / 1600px+q0.72=191KB。
  //   q0.8 は等倍で見比べて許容と判断(浅井さん確認済)。⛔ 寸法を削る案は不採用。
  const JPEG_QUALITY = 0.8;

  // 先行サムネ(2026-09-07)。⚠⚠ **上の「寸法を削る案は不採用」を覆すものではない** ──
  //   原寸(2048/q0.8)は据え置きのまま、**その手前に軽い 1 枚を先に送る**だけ。
  //
  // 【なぜ要るか】2026-09-05 の対策は「同じ 400-600KB を粘って送り切る」方向だけで、
  //   **送る量を 1 バイトも減らしていなかった**。∴ 42kbps を下回る回線では何回粘っても
  //   構造的に完走しない。2026-09-07 の安全パトロールで iPhone 側が実際に詰まり、
  //   現場が破棄して**是正写真と失敗理由が両方消えた**(Storage には 1 枚も届いていなかった)。
  // ★ 直し方: 「写真が着く」と「指摘が登録される」を切り離す。30-50KB のサムネを先に
  //   上げて DB 行を確定させれば、業務価値(指摘が一覧に出る)は 1/10 の通信量で確保できる。
  //   原寸は**同じ storagePath へ後から upsert** するので、PC 側もスキーマも改修不要。
  // ⚠ 原寸が永久に届かなければサムネが最終画質になる。∴ 極端に小さくしないこと。
  const THUMB_EDGE = 640;
  const THUMB_QUALITY = 0.6;
  // サムネは短命キャッシュにする。⚠ 原寸に差し替わったとき CDN が古いサムネを返し続けると
  //   「いつまでも粗いまま」に見えるため。原寸側は既定(3600)でよい。
  const THUMB_CACHE_CONTROL = '60';
  const FULL_CACHE_CONTROL = '3600';

  // アップロードのタイムアウト(ms)。
  // ⚠⚠ **これが無いと電波が弱い所で fetch がハングし、drain ループの `draining` が
  //   立ちっぱなしになって「今すぐ再送」も 15 秒間隔の自動再送も入口で弾かれる**
  //   ＝ クルクル回ったまま、電波が回復しても自力では復帰しない(復帰手段はページ再読込だけ)。
  //   2026-09-05 の安全パトロールで実際に詰まった。
  // ⛔ Promise.race で見捨てる形にしないこと ── 死んだ通信が裏で走り続けて帯域を食い、
  //   再送とぶつかる。AbortController で実際に切る。
  //
  // ★ 値の根拠（⛔ 初版の「60秒。462KB なら 60kbps でも届く」は**算数が誤り**だった。
  //   462KB = 462*1024*8 = 3,785 kbit ÷ 60kbps = **63.1 秒**で 60 秒に間に合わない。
  //   ＝ 圏外ぎわで毎回 95% 送ったところで切る、という設計意図と正反対の挙動になっていた）:
  //   基準 90 秒 ＝ 462KB を約 42kbps で送り切れる。さらに失敗を重ねた item ほど伸ばす
  //   （90→180 秒）ので、「遅いが進んでいる」回線はいずれ完走する。
  //   ⚠ 上限を置くのは、その間 `draining` が立って他の写真が止まるため。
  const BASE_TIMEOUT_MS = 90000;
  const MAX_TIMEOUT_MS = 180000;
  /** 失敗回数 n の item に許すタイムアウト。 */
  const timeoutForAttempt = (n) => Math.min(BASE_TIMEOUT_MS * (1 + n), MAX_TIMEOUT_MS);
  /** 現在の drain 対象に適用中のタイムアウト（直列 drain なので 1 本で足りる）。 */
  let requestTimeoutMs = BASE_TIMEOUT_MS;

  // 無進捗タイムアウト(2026-09-07)。⚠⚠ **壁時計で切ると「遅いが確実に進んでいる回線」を
  //   完走目前で殺す** ── 上の 90 秒は 462KB を 42kbps で送り切れる値だが、低データモードや
  //   混雑でそれを下回ると、何度リトライしても毎回 95% 送ったところで捨てることになる。
  // ★ 正しい判定は「時間が経ったか」ではなく「**進んでいるか**」。XHR の
  //   `upload.onprogress` は 1 バイト進むたびに鳴るので、**最後の進捗から** この時間が
  //   経ったときだけ切る。20kbps でも進んでいる限り完走する。
  // ⛔ この値を壁時計タイムアウトに読み替えないこと（全体で 30 秒という意味ではない）。
  const STALL_TIMEOUT_MS = 30000;

  // ⚠⚠ **進捗イベントが 1 度も来ない端末がある**（2026-09-07 夕・黒鎺さんの iPhone。
  //   サーバー側の痕跡ゼロ・バナーは「📤 送信中…」のまま進まない）。初版は送信前に
  //   30 秒で武装し、張り直しを `upload.progress` **だけ**に頼っていたので、
  //   **進捗を報告しない端末では実際に送れていても必ず 30 秒で abort** していた
  //   ＝「無進捗」のつもりで「**無イベント**」を殺していた。しかも本文を送り終えた後は
  //   張り直す機会が無く、応答待ちが 30 秒の壁時計に化けていた（旧版は 90 秒＝**退行**）。
  // ★ 「進捗が報告されない」と「進捗が止まった」は**別の状態**。区別が付かない間に
  //   短い無進捗判定を当ててはいけないので、最初の生存 signal が来るまではこの長い
  //   壁時計で待つ。⛔ 2 値を 1 つに戻さないこと。⛔ 120 秒を短くしないこと
  //   （旧版の 90 秒でも Android は完走していた＝それより短いと退行になる）。
  const NO_PROGRESS_FALLBACK_MS = 120000;

  /**
   * タイムアウト(abort)由来の失敗か。
   *
   * ⚠⚠ **`err.name === 'AbortError'` だけでは当たらない**（2026-09-05 クロスレビュー H-3）。
   * supabase-js は元の例外を包み直す:
   *   - Storage  → `StorageUnknownError`（元の例外は `originalError` に退避）
   *   - PostgREST → `PostgrestError`（message が `AbortError: ...` の文字列になる）
   * ∴ 初版の判定は**両経路とも false** で、日本語の「時間切れ」は一度も出ず、
   * 破棄ダイアログには英語の生メッセージ（`The user aborted a request.` 等）が並んでいた。
   * ⛔ name の一致だけに戻さないこと。
   */
  function isAbortError(e) {
    if (!e) return false;
    if (e.name === 'AbortError') return true;
    if (e.originalError && e.originalError.name === 'AbortError') return true;
    return /abort/i.test(String(e.message || ''));
  }
  /**
   * タイムアウト付き fetch。supabase-js の全リクエストに効かせる。
   * ⚠ upload だけでなく select にも効く(こちらもハングすると画面が固まるので同じ扱いでよい)。
   * ⚠ AbortError は「失敗」として上位へ伝わり、キューは retry に回る = 写真は消えない。
   */
  function fetchWithTimeout(input, init) {
    // AbortController が無い環境では素の fetch に倒す(切れないだけで動作は従来どおり)。
    if (typeof AbortController !== 'function') return fetch(input, init);
    const ctl = new AbortController();
    // ⚠ 呼び出し側が signal を渡してきたら **捨てずに束ねる**(cross-review M-7)。
    //   Object.assign で上書きすると、将来 postgrest の `.abortSignal()` を入れた日に
    //   **黙って効かなくなる**(気づけない型の壊れ方)。
    const outer = init && init.signal;
    if (outer) {
      if (outer.aborted) ctl.abort();
      else outer.addEventListener('abort', () => ctl.abort(), { once: true });
    }
    const timer = setTimeout(() => ctl.abort(), requestTimeoutMs);
    return fetch(input, Object.assign({}, init, { signal: ctl.signal }))
      .finally(() => clearTimeout(timer));
  }

  /**
   * Storage へアップロードする（**進捗つき**・2026-09-07）。
   *
   * ⚠⚠ supabase-js の `storage.upload()` を使わないのは、fetch では「送信がどこまで
   *   進んだか」が取れず **壁時計でしか切れない**ため。それだと遅いだけの回線を完走目前で
   *   殺す。XHR なら `upload.onprogress` が取れるので **無進捗のときだけ**切れる。
   * 【⛔⛔ multipart はやめた（2026-09-07 夕・S879）── FormData へ戻さないこと】
   * ⚠⚠ 初版は supabase-js の形をそのまま写して
   *   `FormData(cacheControl=<n>, ''=<blob>)` の **multipart** で送っていた。
   *   ⛔ 旧 JSDoc の「Content-Type を自分で付けないこと」「フィールド名の `''` を変えないこと」は
   *   **この multipart 前提の話**で、生ボディにした今は**逆**（Content-Type は必須）。
   *   訂正の経緯を消さないために両方ここに残す。
   *
   * 【なぜやめたか】iPhone 2 台（黒鎺さん・石田君＝**別人**）で送信だけが通らず、
   *   Android は **4G でも WiFi でも**通った ＝ 帯域でも端末設定でもない。
   *   ★ 旧版(supabase-js)と新版(XHR)で**共通していた唯一のもの**が、この
   *   **「フィールド名が空文字の multipart」**だった（supabase-js もブラウザではこの形）。
   *   ∴ WebKit の multipart 実装に依存しない形へ寄せる。
   *
   * 【今の形】⚠ 実物に撃って確認済み（2026-09-07・`scripts/probe-storage-raw-body.js`
   *   ＝ juchu-system 側。200 / `Content-Type: image/jpeg` / `cache-control: max-age=60` が
   *   公開 URL から読めることまで見た）:
   *     POST {url}/storage/v1/object/{bucket}/{path}
   *     headers: apikey / Authorization: Bearer / x-upsert /
   *              Content-Type: <画像の型> / cache-control: max-age=<n>
   *     body: **blob そのもの**（FormData を通さない）
   * ⚠ `cacheControl` は FormData のフィールドではなく **ヘッダー**で渡す（形が変わった）。
   * ⚠ mimetype は Content-Type ヘッダーで決まる。⛔ 付け忘れると型が化ける
   *   （実測では付けなくても 200 は返るので、**失敗では気づけない**）。
   *
   * ⚠⚠ supabase-js の `storage.upload()` を使わないのは、fetch では「送信がどこまで
   *   進んだか」が取れず **壁時計でしか切れない**ため。それだと遅いだけの回線を完走目前で
   *   殺す。XHR なら `upload.onprogress` が取れるので **無進捗のときだけ**切れる。
   */
  function uploadWithProgress(path, blob, cacheControl, contentType) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      let stallTimer = null;
      let stalled = false;
      const clearStall = () => { if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; } };
      // ⚠ 生存 signal のたびに張り直す ＝ 「**最後の signal からの**経過」で切る。
      //   ⛔ ここを一度きりの setTimeout に戻すと、ただの壁時計タイムアウトに退化する。
      // ⚠⚠ **signal が 1 度も来ていない間は短い判定を当てない**（上の NO_PROGRESS_FALLBACK_MS）。
      //   進捗を報告しない端末で「無進捗」と誤診して、送れているのに毎回 abort していた。
      let sawSignal = false;
      const armStall = () => {
        clearStall();
        stallTimer = setTimeout(
          () => { stalled = true; xhr.abort(); },
          sawSignal ? STALL_TIMEOUT_MS : NO_PROGRESS_FALLBACK_MS
        );
      };
      // 生存 signal ＝「この通信はまだ動いている」と言える出来事すべて。
      // ⛔ 上りの progress だけに戻さないこと ── 本文を送り終えると progress は
      //    二度と鳴らないので、応答待ちが壁時計に化ける（2026-09-07 の退行）。
      const bump = () => { sawSignal = true; armStall(); };
      const fail = (msg, name) => {
        clearStall();
        const err = new Error(msg);
        if (name) err.name = name;
        reject(err);
      };
      xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_KEY}`);
      xhr.setRequestHeader('x-upsert', 'true');
      // ⛔ 生ボディなので Content-Type は**必須**（multipart 時代の「付けるな」とは逆）。
      //    付け忘れても 200 は返るので、失敗では気づけない ── 型が黙って化ける。
      xhr.setRequestHeader('Content-Type', contentType || blob.type || 'application/octet-stream');
      // ⚠ cacheControl は FormData のフィールドではなくヘッダーで渡す（形が変わった）。
      xhr.setRequestHeader('cache-control', `max-age=${cacheControl}`);
      // 上り: 1 バイト進むたび / 本文を送り終えた瞬間
      xhr.upload.addEventListener('progress', bump);
      xhr.upload.addEventListener('load', bump);
      // 下り: 応答ヘッダが来た / 本文が流れてきた（＝相手は生きている）
      xhr.addEventListener('readystatechange', () => { if (xhr.readyState >= 2) bump(); });
      xhr.addEventListener('progress', bump);
      xhr.addEventListener('load', () => {
        clearStall();
        if (xhr.status >= 200 && xhr.status < 300) { resolve(); return; }
        // ⚠ 失敗理由は現場の画面に出る（破棄ダイアログだけでなくバナーからも読める）。
        //   ∴ status を必ず残す ── 2026-09-07 は理由が誰にも見られないまま消えた。
        let msg = `アップロードに失敗しました (HTTP ${xhr.status})`;
        try {
          const j = JSON.parse(xhr.responseText);
          if (j && j.message) msg = `${j.message} (HTTP ${xhr.status})`;
        } catch (e) { /* 本文が JSON でなくても status だけは伝わる */ }
        fail(msg);
      });
      xhr.addEventListener('error', () => fail('通信に失敗しました（電波を確認してください）'));
      xhr.addEventListener('abort', () => fail(
        stalled
          // ⚠ 秒数は「どちらの枠で切れたか」で変わる。⛔ 30 秒に固定した文言へ戻さないこと
          //    （進捗を報告しない端末では 120 秒待っており、嘘の数字を現場に出すことになる）。
          ? `通信が ${Math.round((sawSignal ? STALL_TIMEOUT_MS : NO_PROGRESS_FALLBACK_MS) / 1000)} 秒 動きませんでした（電波の良い所で自動再送します）`
          : '送信を中断しました',
        'StallError'
      ));
      // 送信前にも張っておく（接続すら張れない回線で永久に待たないため）。
      // ⚠ この時点では sawSignal=false ＝ **長い方**の枠。進捗を報告しない端末を
      //   「無進捗」と誤診しないための要。⛔ ここで STALL_TIMEOUT_MS を直に使わないこと。
      armStall();
      // ⛔⛔ **FormData に包まないこと**（上の ⛔⛔ を読むこと）。iPhone 2 台で
      //    送信だけが通らなかったときに、旧版・新版で共通していた唯一の構造がこれ。
      xhr.send(blob);
    });
  }

  /**
   * Storage アップロードの入口。XHR が使えない環境では supabase-js に倒す
   * （進捗で切れないだけで、動作は従来どおり）。
   */
  async function uploadBlob(path, blob, cacheControl, contentType) {
    // ⚠ 生ボディ送信になったので **FormData の有無はもう条件ではない**（2026-09-07 夕）。
    //   ⛔ `typeof FormData === 'function'` を条件に戻さないこと ── multipart を
    //   使わないのに FormData の存在を要求すると、無い端末が無意味に fallback へ落ちる。
    if (typeof XMLHttpRequest === 'function') {
      return uploadWithProgress(path, blob, cacheControl, contentType);

    //   iPhone の詰まりが multipart 由来なら、この経路は同じ穴を持つ。今は「XHR が無い」
    //   端末が現実に居ないので据え置くが、⛔ 「全経路 multipart を捨てた」と要約しないこと。
    const { error } = await supabase.storage.from(BUCKET)
      .upload(path, blob, { contentType, upsert: true, cacheControl });
    if (error) throw error;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

  // 共通DOM

  const findingList = document.getElementById('findingList');
  const followForm = document.getElementById('followForm');
  const beforePhoto = document.getElementById('beforePhoto');
  const followCameraBtn = document.getElementById('followCameraBtn');
  const followGalleryBtn = document.getElementById('followGalleryBtn');
  const followCameraInput = document.getElementById('followCameraInput');
  const followGalleryInput = document.getElementById('followGalleryInput');

  const newCameraBtn = document.getElementById('newCameraBtn');
  const newGalleryBtn = document.getElementById('newGalleryBtn');
  const newCameraInput = document.getElementById('newCameraInput');
  const newGalleryInput = document.getElementById('newGalleryInput');
  const newPhotoPreview = document.getElementById('newPhotoPreview');
  const newSendBtn = document.getElementById('newSendBtn');
  const newStatus = document.getElementById('newStatus');
  const newCounter = document.getElementById('newCounter');

  let findings = [];
  let selectedFindingId = null;
  let followFile = null;

  // 先行送信用サムネ(2026-09-07)。⚠ 間に合わなければ null のまま＝従来どおり原寸だけ送る。
  let followThumb = null;

  // init() は IIFE 末尾で呼ぶ。ここ(定義群より前)で呼ぶと、init 内の

  function init() {

    followCameraInput.addEventListener('change', (e) => handlePhoto(e.target.files[0], 'follow'));
    followGalleryInput.addEventListener('change', (e) => handlePhoto(e.target.files[0], 'follow'));
    followSendBtn.addEventListener('click', submitFollow);

    newCameraBtn.addEventListener('click', () => newCameraInput.click());
    newGalleryBtn.addEventListener('click', () => newGalleryInput.click());
    newCameraInput.addEventListener('change', (e) => handlePhoto(e.target.files[0], 'new'));
    newGalleryInput.addEventListener('change', (e) => handlePhoto(e.target.files[0], 'new'));
    workplaceSelect.addEventListener('change', () => {
      localStorage.setItem('safetyPatrolLastWorkplace', workplaceSelect.value);

    commentInput.addEventListener('input', updateNewSendBtn);
    newSendBtn.addEventListener('click', submitNew);

    // 送信待ちキュー: 起動時に未送信分を復元して drain 開始。
    // online 復帰・定期(15s)・「今すぐ再送」でも drain を蹴る。
    qbRetry.addEventListener('click', retryFailed);
    qbDiscard.addEventListener('click', discardFailed);
    // ⛔ `void saveToDevice()` に戻さないこと ── 例外が unhandled rejection になり、

    qbSave.addEventListener('click', () => {
      saveToDevice().catch((e) => {

        setQueueNote('端末に保存できませんでした');
      });
    });
    // ⚠ バナー本体のタップで失敗理由を出す(2026-09-07)。⛔ この配線を消さないこと ──
    //   消すと lastError はまた「破棄ダイアログの中だけ」に戻り、原因が消える経路が復活する。
    //   ボタンのタップは本来の動作を優先する。
    queueBanner.addEventListener('click', (e) => {
      if (e && e.target && e.target.closest && e.target.closest('button')) return;
      showQueueErrors();
    });
    window.addEventListener('online', () => { renderQueueBanner(); drainQueue(); });
    window.addEventListener('offline', renderQueueBanner);
    setInterval(drainQueue, 15000);
    // IndexedDB 可否を判定して恒久警告を出し分け、可なら未送信分を復元して drain 開始
    probeIndexedDB().then(ok => {
      idbWarning.classList.toggle('hidden', ok);
      if (ok) refreshQueueMirror().then(drainQueue);
    });
  }

  async function showMain(location) {
    currentLocation = location;
    locationChip.textContent = location === 'honsha' ? '🏢 本社' : '🏭 北洞';
    locationScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    await Promise.all([loadFindings(location), loadWorkplaces(location)]);
  }

  // ========================================
  // フォロータブ
  // ========================================

  async function loadFindings(location) {
    findingList.innerHTML = '<div class="empty-msg">読み込み中...</div>';
    followForm.classList.add('hidden');
    selectedFindingId = null;

    // 対象月セレクタの値で指摘を絞り込む (デフォルトは先月)
    const monthVal = followMonthInput.value;
    if (!monthVal) return;
    const [y, m] = monthVal.split('-').map(Number);
    const dateFrom = `${y}-${String(m).padStart(2, '0')}-01`;
    const lastDay = new Date(y, m, 0).getDate();
    const dateTo = `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

    const { data, error } = await supabase
      .from('js_safety_findings')
      .select('id, patrol_date, location, workplace_id, comment, before_photo_path, after_photo_path, dismissed_at')
      .eq('location', location)
      .gte('patrol_date', dateFrom)
      .lte('patrol_date', dateTo)
      .is('dismissed_at', null)
      .order('patrol_date')
      .order('workplace_id');

    if (error) { findingList.innerHTML = '<div class="empty-msg">読込エラー</div>'; return; }

    const { data: wps } = await supabase.from('js_safety_workplaces').select('id, name').eq('location', location);
    const wpMap = {};
    (wps || []).forEach(w => { wpMap[w.id] = w.name; });

    findings = (data || []).map(f => ({
      ...f,
      workplace_name: wpMap[f.workplace_id] || '不明',
      before_url: f.before_photo_path ? getPublicUrl(f.before_photo_path) : null,
      before_thumb_url: f.before_photo_path ? getThumbUrl(f.before_photo_path, 200) : null,
      isDone: !!f.after_photo_path
    }));
    renderFindingList();
  }

  function getPublicUrl(path) {
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
  }

  // Supabase Image Transform (Pro プラン以上で使用可)。サムネ取得の高速化用。
  // 原寸が必要な箇所 (Before 写真の大表示・Electron 側) は getPublicUrl を使う。
  function getThumbUrl(path, width) {
    return `${SUPABASE_URL}/storage/v1/render/image/public/${BUCKET}/${path}?width=${width}&quality=60&resize=cover`;
  }

  function renderFindingList() {
    // 未送信(キュー滞留)のフォローも完了扱いにする(二重フォロー防止 + 楽観表示)
    const pending = pendingFollowIds();
    findings.forEach(f => {
      f._pendingFollow = pending.has(f.id) && !f.after_photo_path;
      f.isDone = !!f.after_photo_path || f._pendingFollow;
    });
    const undone = findings.filter(f => !f.isDone);
    const done = findings.filter(f => f.isDone);

    if (findings.length === 0) {
      findingList.innerHTML = '<div class="empty-msg">この月の指摘がありません</div>';
      return;
    }
    findingList.innerHTML = '';

    if (undone.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'empty-msg';
      msg.textContent = '全件フォロー完了!';
      findingList.appendChild(msg);
    }

    undone.forEach(f => findingList.appendChild(createCard(f, false)));
    done.forEach(f => findingList.appendChild(createCard(f, true)));
  }

  function createCard(f, isDone) {
    const card = document.createElement('div');
    card.className = 'finding-card' + (isDone ? ' done' : '') + (f.id === selectedFindingId ? ' selected' : '');
    card.innerHTML = `
      ${f.before_thumb_url ? `<img class="finding-thumb" src="${f.before_thumb_url}" alt="" loading="lazy">` : '<div class="finding-thumb"></div>'}
      <div class="finding-info">
        <div class="finding-workplace">${esc(f.workplace_name)}</div>
        <div class="finding-comment">${esc(f.comment || '')}</div>
        <div class="finding-date">${esc(f.patrol_date)}${isDone ? (f._pendingFollow ? ' <span class="finding-pending-badge">⏳ 送信待ち</span>' : ' <span class="finding-done-badge">✓ フォロー済み</span>') : ''}</div>
      </div>
      ${isDone ? `<button class="finding-reset-btn" data-reset-id="${f.id}" title="${f._pendingFollow ? '送信待ちのフォローを取り消す' : '対象違いの写真をアップした時の取消'}">↺ 取消</button>` : ''}
    `;
    // カードクリック: 未完了 → 選択してフォロー画面へ / 完了 → Before/After 閲覧
    card.addEventListener('click', () => {
      if (isDone) showFindingPhotos(f);
      else selectFinding(f);
    });
    // done カードの「↺ 取消」ボタン
    const resetBtn = card.querySelector('.finding-reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = Number(resetBtn.dataset.resetId);
        if (!id) return;

        // 送信待ち(まだアップロードされていない)フォローはキューから取り消すだけ
        if (f._pendingFollow) {
          if (!confirm('送信待ちのフォローを取り消して撮り直しますか？')) return;
          const items = queueItems.filter(i => i.type === 'follow' && i.finding_id === id);
          for (const i of items) await discardItem(i); // アップ済みなら Storage も掃除
          await refreshQueueMirror();
          renderFindingList();
          return;
        }

        if (!confirm('このAfter写真を取り消して撮り直しますか？\n（対象違いの写真をアップしてしまった時の救済用）')) return;
        try {
          const { error } = await supabase
            .from('js_safety_findings')
            .update({ after_photo_path: null, followed_at: null, follow_comment: null })
            .eq('id', id);
          if (error) throw error;
          await loadFindings(currentLocation);
        } catch (err) {
          alert('取消失敗: ' + (err.message || err));
        }
      });
    }
    return card;
  }

  // 完了済みカードの Before/After 閲覧オーバーレイ
  function showFindingPhotos(f) {
    document.querySelector('.photo-view-overlay')?.remove();
    const afterUrl = f.after_photo_path ? getPublicUrl(f.after_photo_path) : null;
    const overlay = document.createElement('div');
    overlay.className = 'photo-view-overlay';
    overlay.innerHTML = `
      <div class="photo-view-dialog">
        <button class="photo-view-close" aria-label="閉じる">✕</button>
        <div class="photo-view-title">${esc(f.workplace_name || '')}</div>
        <div class="photo-view-date">${esc(f.patrol_date)}</div>
        <div class="photo-view-comment">${esc(f.comment || '')}</div>
        <div class="photo-view-label">📷 Before</div>
        <img class="photo-view-img" src="${f.before_url || ''}" alt="before">
        ${afterUrl ? `<div class="photo-view-label">✅ After</div><img class="photo-view-img" src="${afterUrl}" alt="after">` : ''}
      </div>
    `;
    // 背景クリックで閉じる（ダイアログ内クリックは伝播させない）
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
    overlay.querySelector('.photo-view-close').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function selectFinding(f) {
    selectedFindingId = f.id;
    followFile = null;
    followThumb = null; // ⚠ 別の指摘へ移るときに前の写真のサムネを持ち越さない
    followCameraInput.value = '';
    followGalleryInput.value = '';
    followPhotoPreview.innerHTML = 'After写真を撮影または選択';
    followStatus.classList.add('hidden');
    updateFollowSendBtn();

    findingList.querySelectorAll('.finding-card').forEach(c => c.classList.remove('selected'));
    const undone = findings.filter(x => !x.isDone);
    const cards = findingList.querySelectorAll('.finding-card:not(.done)');
    cards.forEach((c, i) => { if (undone[i] && undone[i].id === f.id) c.classList.add('selected'); });

    beforePhoto.src = f.before_url || '';
    followForm.classList.remove('hidden');
    setTimeout(() => followForm.scrollIntoView({ behavior: 'smooth' }), 100);
  }

  function updateFollowSendBtn() {
    followSendBtn.disabled = !(selectedFindingId && followFile);
  }

  // 楽観 write-behind: アップロード完了を待たず即キューに積み、フォロー画面を閉じる。
  // 実アップロード(Storage→DB update)は drainQueue が裏で直列実行する。
  async function submitFollow() {
    if (!selectedFindingId || !followFile) return;
    const findingId = selectedFindingId;
    const f = findings.find(x => x.id === findingId);

    try {
      await enqueueUpload({
        type: 'follow',
        finding_id: findingId,
        workplace_name: f ? f.workplace_name : '',
        comment: f ? f.comment : '',
        blob: followFile,
        thumbBlob: followThumb, // ⚠ null なら従来どおり原寸だけ送る(安全側)
        contentType: followFile.type,
        ext: (followFile.name.split('.').pop() || 'jpg').toLowerCase(),
      });
    } catch (e) {
      console.error('[safety-patrol] enqueue(follow) failed:', e);
      showStatusEl(followStatus, '保存に失敗しました。もう一度お試しください', 'error');
      return;
    }

    // 楽観的に完了表示にして次のカードへ即進める
    if (f) f.isDone = true;
    selectedFindingId = null;
    followFile = null;
    followThumb = null;
    followForm.classList.add('hidden');
    followStatus.classList.add('hidden');
    renderFindingList();
  }

  // ========================================
  // 新規指摘タブ
  // ========================================

  async function loadWorkplaces(location) {
    workplaceSelect.innerHTML = '<option value="">読み込み中...</option>';
    const { data, error } = await supabase
      .from('js_safety_workplaces').select('id, name')
      .eq('location', location).eq('is_active', true).order('sort_order');

    if (error) { workplaceSelect.innerHTML = '<option value="">読込失敗</option>'; return; }

    workplaceSelect.innerHTML = '<option value="">-- 選択してください --</option>' +
      (data || []).map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('');

    const lastId = localStorage.getItem('safetyPatrolLastWorkplace');
    if (lastId && (data || []).some(w => String(w.id) === String(lastId))) workplaceSelect.value = lastId;

  function updateNewSendBtn() {
    newSendBtn.disabled = !(workplaceSelect.value && commentInput.value.trim() && newFile);
  }

  // 楽観 write-behind: アップロード完了を待たず即キューに積み、フォームを空にして
  // 次の撮影へ進める。実アップロード(Storage→DB insert)は drainQueue が裏で直列実行。
  // patrol_date は「キューに積んだ瞬間」(=撮影時刻) で固定する。
  async function submitNew() {
    if (!newFile || !workplaceSelect.value || !commentInput.value.trim()) return;

    // patrol_date は JST 基準の暦日で固定(端末TZズレ・月末深夜の月境界ズレを防ぐ・M-6)
    const dateStr = jstDateStr();

    try {
      await enqueueUpload({
        type: 'new',
        location: currentLocation,
        patrol_date: dateStr,
        workplace_id: parseInt(workplaceSelect.value, 10),
        comment: commentInput.value.trim(),
        blob: newFile,
        thumbBlob: newThumb, // ⚠ null なら従来どおり原寸だけ送る(安全側)
        contentType: newFile.type,
        ext: (newFile.name.split('.').pop() || 'jpg').toLowerCase(),
      });
    } catch (e) {
      console.error('[safety-patrol] enqueue(new) failed:', e);
      showStatusEl(newStatus, '保存に失敗しました。もう一度お試しください', 'error');
      return;
    }

    totalSubmitted++;
    newCounter.classList.remove('hidden');
    newCounter.textContent = `本日の登録件数: ${totalSubmitted}件`;

    // フォームを即クリア(職場は連続入力のため残す)
    commentInput.value = '';
    newFile = null;
    newThumb = null;
    newCameraInput.value = '';
    newGalleryInput.value = '';
    newPhotoPreview.innerHTML = '写真を撮影または選択';
    newStatus.classList.add('hidden');
    updateNewSendBtn();
  }

  // ========================================
  // 送信待ちキュー (IndexedDB 永続 + 直列 drain)
  // ========================================
  // 通信が悪くても撮影を妨げないための楽観 write-behind。送信ボタンで写真Blobと
  // メタを IndexedDB に積み(=永続)、フォームを即解放。裏で drainQueue が古い順に
  // 1件ずつ Storage アップロード→DB 書込み→キュー削除。ページを閉じても未送信分は
  // 残り、次回起動時に自動で送信再開する。

  const QUEUE_DB = 'safetyPatrolQueue';
  const QUEUE_STORE = 'uploads';
  // ⚠⚠ **「知らせるしきい値」と「諦めるしきい値」を分ける**(2026-09-05)。
  // 旧版は MAX_RETRY=5 の 1 本で、再送が 15 秒間隔だったため **電波が悪いと約 1 分で
  // 「送信できない」確定になり、自動再送が永久に止まった**。現場は良い場所へ移動しても
  // 何も起きず、手で「今すぐ再送」を押すまで詰まったまま(押せない場面もある = 上の has-queue)。
  // ★ 直し方: 早く知らせる(WARN)のはそのまま、諦める(MAX)のはずっと後ろへ。
  //   さらに再送間隔を指数的に伸ばして、電池と通信を無駄に使わずに粘る。
  const WARN_RETRY = 5;   // これを超えたら画面で知らせる(ボタンを出す)。⛔ 送信は止めない
  const MAX_RETRY = 50;   // ここまで来たら本当に諦める(恒久エラーの打ち切り)
  // 原寸の後追い(Phase3)だけが残っている item を諦める回数(2026-09-07)。
  // ⚠⚠ **MAX_RETRY より*ずっと早く*諦めるのが正しい** ── この段まで来た item は
  //   指摘も写真(サムネ)も既にサーバーに在り、残っているのは**画質を上げる作業だけ**。
  //   そこで現場を待たせて「送信できない ◯件」を出し続けると、逃げ場が無いと感じた人が
  //   破棄を押す ＝ 2026-09-07 に実際に起きたことを繰り返す。
  const FULL_GIVEUP_RETRY = 8;
  /** 連続失敗回数 → 次に試すまでの待ち時間(ms)。15秒→30秒→1分→3分→10分で頭打ち。 */
  const RETRY_DELAYS_MS = [15000, 30000, 60000, 180000, 600000];
  const retryDelayFor = (n) => RETRY_DELAYS_MS[Math.min(n, RETRY_DELAYS_MS.length - 1)];
  let _qdb = null;

  function openQueueDB() {
    if (_qdb) return Promise.resolve(_qdb);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(QUEUE_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(QUEUE_STORE)) db.createObjectStore(QUEUE_STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => { _qdb = req.result; resolve(_qdb); };
      req.onerror = () => reject(req.error);
    });
  }

  // IndexedDB が使えるか起動時に判定(M-7)。iOS プライベートブラウズ等では
  // open が error/hang になり、enqueue が毎回エラートースト止まりになる。事前に
  // 検知して恒久警告を出す。hang 対策に 3s タイムアウトで「不可」とみなす。
  function probeIndexedDB() {
    if (!window.indexedDB) return Promise.resolve(false);
    return Promise.race([
      openQueueDB().then(() => true, () => false),
      new Promise(res => setTimeout(() => res(false), 3000)),
    ]);
  }

  function idbTx(mode, fn) {
    return openQueueDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(QUEUE_STORE, mode);
      const store = tx.objectStore(QUEUE_STORE);
      let result;
      const r = fn(store);
      if (r) r.onsuccess = () => { result = r.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }));
  }

  const idbPut = (item) => idbTx('readwrite', s => s.put(item));
  const idbDelete = (id) => idbTx('readwrite', s => s.delete(id));
  const idbGetAll = () => idbTx('readonly', s => s.getAll());

  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
  }

  // フォームから1件キューに積む。storagePath は item の UUID から決定論的に作る
  // (リトライで二重発番しない + アイテム間で衝突しない=upsert で別写真を上書きしない)。
  /**
   * 写真を **バイト列(ArrayBuffer)** にして持つ。
   *
   * ⚠⚠⚠ **Blob / File のまま IndexedDB に入れないこと**（2026-09-07 夕・S879）。
   * iPhone 2 台（黒鎺さん・石田君＝別人）で送信だけが通らず、Android は 4G/WiFi 両方で通った。
   * ★ 決め手は **同じリポの `index.html`（出荷マニュアルの写真アップロード）が
   *   谷口さんの iPhone で普通に使えている**こと ── あちらは `supabase.storage.upload()`
   *   ＝ **こちらの旧版とまったく同じ multipart** で送っている。∴ multipart は犯人ではない。
   *   2 ページの差は **「入力からその場で送る」か「IndexedDB へ入れて読み戻してから送る」か**
   *   の 1 点だけ。∴ 読み戻した Blob が iOS で使えていない疑いが濃い（WebKit の既知の弱点）。
   * ⛔ 「multipart が悪い」「supabase-js に戻せば直る」へ引き返さないこと ──
   *   どちらも出荷マニュアル側の実績で否定されている。
   * ⚠ ArrayBuffer は構造化クローンでそのまま複製されるので、Blob の backing store に依存しない。
   */
  async function toBytes(b) {
    if (!b) return null;
    if (b.byteLength != null) return b;            // 既に ArrayBuffer
    if (typeof b.arrayBuffer === 'function') return await b.arrayBuffer();
    return null;
  }

  /**
   * 保存したバイト列を送信直前に Blob へ組み直す。
   * ⚠ 旧版でキューに残った item は Blob のまま入っているので、その場合はそのまま使う
   *   （⛔ 旧 item を弾かないこと ── 現場に残っている未送信写真が消える）。
   */
  function asBlob(v, type) {
    if (!v) return null;
    if (typeof Blob === 'function' && v instanceof Blob) return v;
    if (v.byteLength != null) return new Blob([v], { type: type || 'image/jpeg' });
    return null;
  }

  async function enqueueUpload(payload) {
    const id = genId();
    const item = {
      id,
      createdAt: new Date().toISOString(),
      storagePath: `${FOLDER}/${id}.${payload.ext}`,
      storageUploaded: false,
      retryCount: 0,
      lastError: null,
      ...payload,
      // ⛔ 上の ⚠⚠⚠ を読むこと。Blob のまま積む形へ戻さない。
      blob: await toBytes(payload.blob),
      thumbBlob: await toBytes(payload.thumbBlob),
    };
    await idbPut(item);
    await refreshQueueMirror();
    drainQueue();
  }

  async function refreshQueueMirror() {
    try { queueItems = await idbGetAll() || []; }
    catch (e) { queueItems = []; }
    renderQueueBanner();
  }

  // 多タブ/PWA で同時に開くと両コンテキストが同じキューを drain し、同一 item を
  // 二重処理しうる(draining はページ内フラグのみ)。Web Locks でコンテキスト間排他し、
  // 他が drain 中ならスキップする(M-1)。未対応環境(古い Safari 等)はページ内
  // フラグのみで従来動作。なお new の二重 insert は DB UNIQUE(before_photo_path)、
  // follow の後勝ちは `.is(after_photo_path,null)` で別途守られている(多層防御)。
  async function drainQueue() {
    if (!navigator.onLine) { renderQueueBanner(); return; }
    if (navigator.locks && navigator.locks.request) {
      await navigator.locks.request('safetyPatrolDrain', { ifAvailable: true }, lock => {
        if (!lock) return;          // 他コンテキストが drain 中 → 二重 drain を回避
        return drainQueueInner();
      });
    } else {
      await drainQueueInner();
    }
  }

  // 古い順に1件ずつ処理。失敗は retryCount++ で残し、次の item へ進む(毒入り1件で
  // 全体を止めない)。MAX_RETRY 到達分はもう叩かず(失敗確定)、人手の再送/破棄を待つ。
  // まだ再試行余地のある失敗が出たらバックオフ後に再試行。
  async function drainQueueInner() {
    if (draining || !navigator.onLine) { renderQueueBanner(); return; }
    draining = true;
    renderQueueBanner();
    let willRetry = false;
    let followDone = false;
    try {
      const items = (await idbGetAll() || []).sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
      for (const item of items) {
        if ((item.retryCount || 0) >= MAX_RETRY) continue; // 失敗確定は素通り
        // ⚠⚠ **バックオフを実際に効かせているのはこの 1 行**（2026-09-05 クロスレビュー H-1）。
        //   初版は RETRY_DELAYS_MS を scheduleRetry の遅延にしか使っておらず、
        //   `setInterval(drainQueue, 15000)` が無条件で叩き続けるので **15 秒間隔のまま**だった
        //   （＝ retryCount が 15 秒ごとに +1 し、MAX_RETRY=50 に約 12 分で到達して恒久停止）。
        //   ⛔ このゲートを外すとバックオフ表がまた飾りになる。
        if (item.nextAttemptAt && Date.now() < item.nextAttemptAt) continue;
        // ⚠ 遅い回線を殺さないよう、失敗を重ねた item ほどタイムアウトを伸ばす（H-4）。
        //   直列 drain なので、この 1 本の item に対してだけ効く。
        requestTimeoutMs = timeoutForAttempt(item.retryCount || 0);
        try {
          await processQueueItem(item);
          await idbDelete(item.id);
          markUploaded(item);
          if (item.type === 'follow') followDone = true;
        } catch (err) {
          item.retryCount = (item.retryCount || 0) + 1;
          // ⚠ タイムアウトは AbortError で来る。現場に「切れた」と分かる言葉で残す
          //   (破棄ダイアログに出るのはこの文字列)。
          item.lastError = isAbortError(err)
            ? `通信が遅くて時間切れになりました（${Math.round(requestTimeoutMs / 1000)}秒）`
            : err && err.message
              ? err.message
              : String(err);
          // ⚠⚠ 原寸の後追い(Phase3)だけが残っている item は、**指摘も写真も既に在る**。
          //   ここで粘っても得られるのは画質だけなので、早めに降ろして現場を解放する。
          //   ⛔ この分岐を消すと「送信できない ◯件」が出続け、また破棄させることになる。
          if (item.dbDone && item.retryCount >= FULL_GIVEUP_RETRY) {
            await idbDelete(item.id);
          } else {
            // 次に試してよい時刻を item 自身に持たせる（＝バックオフの実体）。
            item.nextAttemptAt = Date.now() + retryDelayFor(item.retryCount);
            await idbPut(item);
            if (item.retryCount < MAX_RETRY) willRetry = true; // まだ再試行する
          }
        }
        await refreshQueueMirror();
      }
    } finally {
      draining = false;
    }
    renderQueueBanner();
    // 送信完了でフォローカードのバッジ(⏳送信待ち→✓フォロー済み)を更新
    if (followDone && findings.length) renderFindingList();
    if (willRetry) scheduleRetry();
  }

  // drain 成功後、メモリ上の findings も確定状態へ寄せる。これをやらないと
  // キューから消えた直後の再描画で after_photo_path=null に戻りカードが未完了化する。
  function markUploaded(item) {
    if (item.type !== 'follow') return;
    const f = findings.find(x => x.id === item.finding_id);
    if (f) { f.after_photo_path = item.storagePath; f.isDone = true; f._pendingFollow = false; }
  }

  /**
   * 原寸の後追いアップロードが要るか(2026-09-07)。
   *
   * ⚠ 旧版でキューに残った item は `thumbBlob` も `fullUploaded` も持たない。その場合
   *   Phase1 で上げたのは**原寸そのもの**なので、後追いを走らせると同じ 400-600KB を
   *   無駄に送り直すことになる(細い回線ではそれ自体が詰まりの種)。
   *   ∴ 後追いの対象は「**サムネを先に送った item**」だけ。
   */
  function needsFullUpload(item) {
    if (!item.thumbBlob) return false;
    return !item.fullUploaded;
  }

  async function processQueueItem(item) {
    // ============================================================
    // Phase1: **最小の 1 枚**を Storage へ(2026-09-07)
    // ============================================================
    // ⚠⚠ ここで原寸(400-600KB)を送っていたことが 2026-09-07 の詰まりの構造的な原因。
    //   「写真が着く」と「指摘が登録される」が一蓮托生で、400KB が通らないと **1KB の
    //   DB 行すら作られなかった**(現に Storage には 1 枚も届かず、指摘も 1 件も残らなかった)。
    //   ∴ サムネ(30-50KB)があれば**そちらを先に**送り、業務価値を 1/10 の通信量で確定させる。
    // ⚠ 部分成功後のリトライで二重にならないよう storageUploaded フラグ + upsert:true。
    if (!item.storageUploaded) {
      // ⚠ IndexedDB にはバイト列で入っているので、送る直前に Blob へ組み直す（asBlob）。
      //   ⛔ `item.thumbBlob` をそのまま渡す形へ戻さないこと（上の ⚠⚠⚠）。
      const first = asBlob(item.thumbBlob, 'image/jpeg') || asBlob(item.blob, item.contentType);
      await uploadBlob(
        item.storagePath,
        first,
        item.thumbBlob ? THUMB_CACHE_CONTROL : FULL_CACHE_CONTROL,
        item.thumbBlob ? 'image/jpeg' : item.contentType
      );
      item.storageUploaded = true;
      // サムネを使わなかったなら、この 1 枚が原寸そのもの＝ Phase3 は不要。
      item.fullUploaded = !item.thumbBlob;
      await idbPut(item);
    }
    // ============================================================
    // Phase2: DB 書込み(ここが通れば指摘が一覧に出る＝業務価値が確定する)
    // ============================================================
    if (!item.dbDone) {
      await writeDbRow(item);
      item.dbDone = true;
      await idbPut(item);
    }
    // ============================================================
    // Phase3: 原寸を**同じパスへ**後追い upsert(2026-09-07)
    // ============================================================
    // ⚠ ここが落ちても指摘は既に登録済みなので、実害は「画質が粗いまま」だけ。
    //   ∴ drain 側ではこの段だけ早めに諦めてキューから降ろす(現場を待たせない)。
    // ⛔ 別パスに保存しないこと ── PC の指摘ビューアは before/after のパスをそのまま
    //   読むので、**同じパスへ上書き**すれば PC もスキーマも改修なしで高画質に差し替わる。
    if (needsFullUpload(item)) {
      // ⚠ ここも保存はバイト列。⛔ item.blob を直に渡す形へ戻さないこと。
      await uploadBlob(item.storagePath, asBlob(item.blob, item.contentType), FULL_CACHE_CONTROL, item.contentType);
      item.fullUploaded = true;
      await idbPut(item);
    }
  }

  /**
   * 指摘行を書く(new=insert / follow=update)。
   * ⚠ **冪等であること** ── Phase1/Phase3 の失敗でこの関数は何度も呼ばれうる。
   */
  async function writeDbRow(item) {
    if (item.type === 'new') {
      // 二重 insert 防止: storagePath は item 固有なので自然キーになる。
      // 「アップ成功・insert 応答だけ消失」でリトライしても重複行を作らない。
      // ⚠ 重複チェックの error を握り潰さない（cross-review M-5）。ここが落ちると
      //   `existing` が null になり、**重複チェックを素通りして INSERT に進む**。
      //   落ちたこと自体は致命ではない（下の 23505 で受け止める）ので通すが、黙らせない。
      const { data: existing, error: dupErr } = await supabase
        .from('js_safety_findings').select('id').eq('before_photo_path', item.storagePath).limit(1);
      if (dupErr) console.warn('[safety-patrol] 重複チェックに失敗（INSERT で受け止める）:', dupErr.message);
      if (!existing || existing.length === 0) {
        const { error } = await supabase.from('js_safety_findings').insert({
          patrol_date: item.patrol_date,
          location: item.location,
          workplace_id: item.workplace_id,
          comment: item.comment,
          before_photo_path: item.storagePath,
          created_by: 'mobile',
        });
        // ⚠⚠ **23505（before_photo_path の UNIQUE 違反）は「もう入っている」＝実質成功**
        //   （cross-review M-5）。失敗として throw すると、行は既に在るのに送信待ちのまま
        //   retryCount を食い潰し、最後は「送信できない」になって現場に破棄させる。
        //   storagePath は item の UUID 由来で他の写真と衝突しないので、重複＝自分の再送。
        if (error && error.code !== '23505') throw error;
      }
    } else {
      // 先勝ち: 既に After がある行には書かない(二重フォローの後勝ち上書き防止)。
      // 却下済み(dismissed_at)にも書かない。0 行一致でも error にはならず冪等に成功扱い。
      const { error } = await supabase.from('js_safety_findings').update({
        after_photo_path: item.storagePath,
        follow_comment: null,
        followed_at: new Date().toISOString(),
      }).eq('id', item.finding_id).is('after_photo_path', null).is('dismissed_at', null);
      if (error) throw error;
    }
  }

  /**
   * 次の再送を予約する。
   *
   * ⚠⚠ **待ち時間を決めているのはここではない**（2026-09-05 クロスレビュー H-1 で是正）。
   * カデンツの実体は `drainQueueInner` の `item.nextAttemptAt` ゲート。ここは
   * 「15 秒の定期 tick より早く様子を見に行く」だけの補助で、⛔ **ここに遅延計算を
   * 戻さないこと** ── 2 本の仕組みが併存すると、どちらが効いているか分からなくなる
   * （初版はまさにそれで、バックオフ表が飾りになっていた）。
   */
  function scheduleRetry() {
    if (retryTimer) return;
    retryTimer = setTimeout(() => { retryTimer = null; drainQueue(); }, RETRY_DELAYS_MS[0]);
  }

  function renderQueueBanner() {
    const n = queueItems.length;
    // ⚠ バナーが出ている間だけ本文の下に逃げ場を作る(バナーが送信ボタンを覆うのを防ぐ)。
    document.body.classList.toggle('has-queue', n > 0);
    if (n === 0) { queueBanner.classList.add('hidden'); return; }
    queueBanner.classList.remove('hidden');
    // ⚠ 「知らせる」は WARN_RETRY。⛔ **ここで「送信できない」と言い切らないこと** ──
    //   MAX_RETRY まで自動再送を続けているので、その文言は嘘になるうえ、
    //   現場に「もう破棄するしかない」と誤解させて写真を消させる(2026-09-05)。
    const warned = queueItems.filter(i => (i.retryCount || 0) >= WARN_RETRY).length;
    // ⚠⚠ **本当に諦めた分**（MAX_RETRY 到達＝もう 1 回も叩かない）。
    //   初版はこれを数えず、諦めた後も「電波の良い所で自動送信」と出し続けていた
    //   ＝ 現場が良い場所へ移動して待っても永久に何も起きない（2026-09-05 クロスレビュー H-2）。
    //   ⛔ 「言い切るのをやめる」と「諦めたことを言わない」を混同しないこと。
    const dead = queueItems.filter(i => (i.retryCount || 0) >= MAX_RETRY).length;
    const retrying = queueItems.some(i => (i.retryCount || 0) > 0);
    // ⚠⚠ 原寸の後追いだけが残っている状態を「送れていません」と言わない(2026-09-07)。
    //   指摘も写真も既にサーバーに在り、残っているのは**画質を上げる作業だけ**。
    //   ここで危機的な文言を出すと、現場は「もう破棄するしかない」と判断する
    //   ＝ 2026-09-07 に是正写真と失敗理由が両方消えた経路そのもの。
    const allDbDone = n > 0 && queueItems.every(i => i.dbDone);

    queueBanner.classList.toggle('offline', !navigator.onLine && warned === 0);
    // ⚠ 画質待ちだけの状態は赤くしない(不安を煽って破棄させない)。
    queueBanner.classList.toggle('error', !allDbDone && (warned > 0 || (navigator.onLine && retrying)));

    let text;
    if (dead > 0) text = `✕ 送信できない ${dead}件（タップで理由・端末に保存できます）`;
    else if (!navigator.onLine) text = `📴 オフライン — 送信待ち ${n}件（接続後に自動送信）`;
    else if (draining) text = `📤 送信中… 残り ${n}件`;
    else if (allDbDone) text = `🖼 画質を上げる送信が残っています ${n}件（指摘は登録済みです）`;
    else if (warned > 0) text = `⚠️ まだ送れていません ${n}件（自動再送中・タップで理由）`;
    else if (retrying) text = `⚠️ 送信待ち ${n}件（自動で再送します）`;
    else text = `📤 送信待ち ${n}件`;
    qbText.textContent = text;

    qbSpin.classList.toggle('hidden', !(draining && navigator.onLine));
    // 再送: オンラインで再試行中かつ drain 停止中。
    qbRetry.classList.toggle('hidden', !(navigator.onLine && retrying && !draining));
    // 端末に保存 / 破棄: 知らせるしきい値を超えてから出す。
    // ⛔ 「保存」を「破棄」より **先(左)** に置くこと ── 逃がす手を与えずに消させない。
    // ⚠ 画質待ちだけの item には出さない ── 写真は既に Storage に在るので「端末に保存」は
    //   要らず、「破棄」の警告文(元に戻せません)も**嘘になる**。
    qbSave.classList.toggle('hidden', warned === 0 || allDbDone);
    qbDiscard.classList.toggle('hidden', warned === 0 || allDbDone);

    // ⚠⚠ **バナーの実高さを測って本文の下余白に入れる**(cross-review M-1)。
    //   ⛔ 固定値に戻さないこと ── ボタンの増減・文言の折り返し・端末幅で高さは変わる。
    //   初版は 108px 固定で、同じコミットで足した 3 つ目のボタンに足りていなかった。
    //   ★ ここは textContent と hidden を全部確定させた **後** に測ること(順序が意味を持つ)。
    //   ⚠ 実 DOM 以外（テストのハーネス等）では documentElement / offsetHeight が
    //     無いことがある。⛔ ここで落ちると **送信そのものが止まる**（refreshQueueMirror
    //     経由で呼ばれる）ので、高さの計測は必ず任意扱いにする。
    const h = queueBanner.offsetHeight || 0;
    const root = document.documentElement;
    if (h > 0 && root && root.style) root.style.setProperty('--queue-pad', (h + 28) + 'px');
  }

  /**
   * 送信待ちの写真を**端末に保存**する(最後の砦)。
   *
   * 【なぜ要るか】キューの写真はブラウザの中(IndexedDB)にしか無い。撮影は
   * `capture="environment"` なので **カメラロールには残っていない**。∴ 送信が続けて
   * 失敗したとき、現場に残された操作が「破棄」しか無いと **原本ごと消える**。
   * ここで端末へ逃がせるようにして、最悪でも写真は手元に残るようにする。
   *
   * ⚠ iOS は共有シート経由(navigator.share)でないと写真アプリへ入らないので、
   *   使えるならそちらを優先し、無ければダウンロードに倒す。
   */
  /**
   * 保存対象を組み立てる（同期・⚠ **await を挟まないこと**）。
   *
   * ⚠⚠ iOS Safari の Web Share API は **トランジェント・ユーザー活性化**を要求し、
   * `await` を跨ぐと `NotAllowedError` で落ちる。初版は先頭で `await idbGetAll()` して
   * いたので、iOS では共有シートが出ない公算が高かった（cross-review H-6）。
   * ∴ blob を持つメモリミラー `queueItems` から**同期で**組み、最初の await を
   * `navigator.share()` 自身にする。⛔ ここに await を足さないこと。
   *
   * ⚠ 壊れた item（blob 欠落）は落とす。`new File([undefined], …)` は throw せず
   * **文字列 "undefined" の 9 バイトのゴミ**を作る（実測）ので、素通しすると
   * 「保存できた」と見えて中身が無い、という最悪の形になる（cross-review H-5）。
   */
  function buildSaveFiles() {
    if (typeof File !== 'function') return [];
    return queueItems
      // ⚠ 保存はバイト列になったので `instanceof Blob` では 1 件も拾えない
      //   （＝「端末に保存」が黙って 0 件になる）。⛔ instanceof 判定へ戻さないこと。
      .filter(it => it && asBlob(it.blob, it.contentType) && (it.retryCount || 0) >= WARN_RETRY)
      .slice()
      .sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1)) // 撮影順（drain と同じ規則）
      .map((it, i) => {
        const ext = ((it.storagePath || '').split('.').pop() || 'jpg');
        // ⚠ follow の payload には patrol_date が無いので createdAt で代替する。
        const day = (it.patrol_date || String(it.createdAt || '').slice(0, 10) || '')
          .replace(/-/g, '');
        const kind = it.type === 'follow' ? 'フォロー' : '安全指摘';
        return new File([asBlob(it.blob, it.contentType)], `${kind}_${day}_${i + 1}.${ext}`, {
          type: it.contentType || 'image/jpeg',
        });
      });
  }

  /**
   * 送信できていない写真を**端末に保存**する（最後の砦）。
   *
   * 【なぜ要るか】キューの写真はブラウザの中(IndexedDB)にしか無い。撮影は
   * `capture="environment"` なので **カメラロールには残っていない**。∴ 送信が続けて
   * 失敗したとき、現場に残された操作が「破棄」しか無いと **原本ごと消える**。
   *
   * ⚠⚠ **結果を必ず画面に出す**（cross-review H-5）。初版は `void saveToDevice()` で
   * 例外を握りつぶし、成功も失敗も無言だった ── 最後の砦が無反応だと、現場は
   * 「逃げ場が無い」と判断して破棄を押す＝この修正が防ごうとした事故そのものが起きる。
   */
  async function saveToDevice() {
    const files = buildSaveFiles();
    if (!files.length) {
      setQueueNote('保存できる写真がありませんでした');
      return;
    }
    try {
      if (navigator.canShare && navigator.canShare({ files }) && navigator.share) {
        await navigator.share({ files, title: '安全パトロール 指摘写真' });
        setQueueNote(`${files.length}件を共有しました（写真アプリに保存してください）`);
        return;
      }
    } catch (e) {
      if (isAbortError(e)) return; // 利用者が共有シートを閉じただけ
      // 共有が使えない/拒否された端末 → 下のダウンロードに倒す
    }
    // フォールバック: 1 枚ずつダウンロード。
    // ⚠ 2 枚目以降はユーザー活性化を失っており、端末によってはブロックされる。
    //   ∴ 何枚保存できたかを必ず出す（黙って 1 枚だけ、を作らない）。
    let saved = 0;
    for (const f of files) {
      try {
        const url = URL.createObjectURL(f);
        const a = document.createElement('a');
        a.href = url; a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        // ⚠ プレビューが開いたまま失効しないよう長めに持つ。
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        saved++;
      } catch (e) {
        console.error('[safety-patrol] download failed:', e);
      }
      await new Promise(r => setTimeout(r, 400));
    }
    setQueueNote(
      saved === files.length
        ? `${saved}件をダウンロードしました`
        : `${saved}/${files.length}件しか保存できませんでした（1枚ずつお試しください）`
    );
  }

  /**
   * バナーに一時的な結果を出す（次の renderQueueBanner で通常表示へ戻る）。
   * ⚠ タイマーは 1 本に束ねる ── 束ねないと、長く出したい表示が後から来た短い表示の
   *   タイマーに巻き込まれて先に消える。
   */
  let queueNoteTimer = null;
  function setQueueNote(msg, ms) {
    qbText.textContent = msg;
    if (queueNoteTimer) clearTimeout(queueNoteTimer);
    queueNoteTimer = setTimeout(() => { queueNoteTimer = null; renderQueueBanner(); }, ms || 4000);
  }

  /**
   * 送信待ちの**失敗理由**を画面に出す(2026-09-07)。
   *
   * ⚠⚠ これまで `lastError` は**破棄ダイアログの中にしか出なかった** ── つまり
   *   「消す瞬間にだけ見える」設計だった。2026-09-07 の安全パトロールでは現場が破棄した
   *   結果、**写真と一緒に失敗理由も消え**、iPhone 側で何が起きていたのか誰にも
   *   分からなくなった（Storage にも DB にも痕跡が無い＝後から追う手が一切残らない）。
   * ★ ∴ 破棄しなくても読めるようにする。原因が分かれば次は直せる。
   */
  function showQueueErrors() {
    const failed = queueItems.filter(i => i.lastError);
    if (!failed.length) {
      setQueueNote(`送信待ち ${queueItems.length}件（まだエラーは出ていません）`);
      return;
    }
    // ⚠ 同じ理由が並ぶだけなので種類ごとにまとめる（3 件並べても情報は増えない）。
    const counts = new Map();
    for (const i of failed) counts.set(i.lastError, (counts.get(i.lastError) || 0) + 1);
    const lines = Array.from(counts.entries())
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([msg, c]) => (c > 1 ? `${msg} (${c}件)` : msg));
    setQueueNote(lines.join(' / '), 12000);
  }

  // 1件破棄。アップロード済みなら Storage の孤児ファイルを best-effort で掃除する。
  async function discardItem(item) {
    if (item.storageUploaded) {
      try { await supabase.storage.from(BUCKET).remove([item.storagePath]); } catch (e) { /* best-effort */ }
    }
    await idbDelete(item.id);
  }

  // 「今すぐ再送」: 失敗/リトライ中の retryCount を 0 に戻して(IDBにも反映)再 drain。
  async function retryFailed() {
    const items = await idbGetAll() || [];
    for (const it of items) {
      if ((it.retryCount || 0) > 0) { it.retryCount = 0; it.lastError = null; await idbPut(it); }
    }
    await refreshQueueMirror();
    drainQueue();
  }

  // 「破棄」: 送信できない確定分を Storage 掃除つきで捨てる。
  async function discardFailed() {
    // ⚠ しきい値は WARN_RETRY(＝画面で知らせた分)。⛔ MAX_RETRY に戻さないこと ──
    //   バナーに破棄ボタンが出ているのに何も消えない状態になる。
    const items = (await idbGetAll() || []).filter(i => (i.retryCount || 0) >= WARN_RETRY);
    if (!items.length) return;
    const detail = items.slice(0, 3).map(i => '・' + (i.lastError || '不明なエラー')).join('\n');
    // ⚠⚠ 撮影は capture 経由なので **写真はカメラロールに残っていない**。破棄＝原本が消える。
    //   ∴ 逃がす手があることを、消す直前に必ず言う。
    if (!confirm(
      `${items.length}件を破棄しますか？\n${detail}\n\n` +
      `⚠ この写真はスマホの写真アプリには残っていません。\n` +
      `破棄すると元に戻せません。先に「端末に保存」で写真を残せます。`
    )) return;
    for (const it of items) await discardItem(it);
    await refreshQueueMirror();
    if (findings.length) renderFindingList();
  }

  // フォローが未送信(キュー滞留)の finding id 集合。フォロー一覧で楽観的に
  // 「完了(送信待ち)」表示し、再選択による二重フォローを防ぐ。
  function pendingFollowIds() {
    return new Set(queueItems.filter(i => i.type === 'follow').map(i => i.finding_id));
  }

  // ========================================
  // 共通ユーティリティ
  // ========================================

  // 写真を canvas で長辺 maxEdge まで縮小し JPEG に再エンコードする共通実装。
  // 成功したら File、できなければ **null**(呼び側が原本に倒すか諦めるかを決める)。
  // EXIF 回転は createImageBitmap の imageOrientation:'from-image' で物理的に反映する。
  // これを怠ると再エンコードで EXIF が剥がれ、縦写真が横倒しで保存されてしまう。
  async function encodeResized(file, maxEdge, quality, skipIfSmaller) {
    if (!file || !file.type || !file.type.startsWith('image/')) return null;
    if (typeof createImageBitmap !== 'function') return null; // 未対応(回転反映できない)
    let bitmap;
    try {
      bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e) {
      return null; // HEIC 等デコード不可
    }
    try {
      const longEdge = Math.max(bitmap.width, bitmap.height);
      if (skipIfSmaller && longEdge <= maxEdge) return null; // 既に十分小さい → 再圧縮しない
      // ⚠ 拡大はしない(1.0 で頭打ち)。小さい原本をサムネ化するときに引き伸ばさないため。
      const scale = Math.min(1, maxEdge / longEdge);
      const w = Math.round(bitmap.width * scale);
      const h = Math.round(bitmap.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
      if (!blob) return null;
      return new File([blob], 'photo.jpg', { type: 'image/jpeg' });
    } catch (e) {
      return null;
    } finally {
      if (bitmap && bitmap.close) bitmap.close();
    }
  }

  // 送信する原寸を作る(M-8)。縮小不要・デコード不可・未対応ブラウザでは原本をそのまま
  // 返す(回転事故やデータ破損を起こさない安全側)。
  async function shrinkImage(file) {
    if (!file) return file;
    const out = await encodeResized(file, MAX_EDGE, JPEG_QUALITY, true);
    if (!out || out.size >= file.size) return file; // 作れない/逆に増えた → 原本
    return out;
  }

  /**
   * 先行送信用のサムネを作る(2026-09-07)。作れなければ **null**＝従来どおり原寸だけ送る。
   *
   * ⚠ shrinkImage と違って **原本にフォールバックしない**。ここで原本を返すと
   *   「軽い 1 枚を先に送る」という目的が消え、細い回線で 400KB を 2 回送ることになる
   *   ＝ 直そうとしている症状を悪化させる。作れないなら黙って諦めるのが正しい。
   */
  async function makeThumb(file) {
    const t = await encodeResized(file, THUMB_EDGE, THUMB_QUALITY, false);
    if (!t) return null;
    if (file && t.size >= file.size) return null; // 逆に増えるなら意味が無い
    return t;
  }

  function handlePhoto(file, mode) {
    if (!file) return;
    const preview = mode === 'follow' ? followPhotoPreview : newPhotoPreview;
    const cameraInput = mode === 'follow' ? followCameraInput : newCameraInput;
    const galleryInput = mode === 'follow' ? followGalleryInput : newGalleryInput;

    if (mode === 'follow') { followFile = file; followThumb = null; }
    else { newFile = file; newThumb = null; }

    // 縮小とサムネは裏で実行(楽観 write-behind の即時性を保つ)。プレビューは原本で即表示し、
    // 縮小が間に合えば差し替える。送信が縮小より早ければ原本を送る(=安全フォールバック)。
    // ⚠⚠ 縮小とサムネを**別々の then で書かないこと**(2026-09-07) ── 先に縮小が終わって
    //   newFile を縮小版へ差し替えると、後から来たサムネ側の `newFile === file` が偽になり、
    //   「写真を差し替えた」と誤判定して**毎回サムネを捨てる**。∴ 判定は 1 箇所にまとめる。
    Promise.all([shrinkImage(file), makeThumb(file)]).then(([shrunk, thumb]) => {
      // 処理中にユーザーが写真を外した/差し替えた場合は上書きしない
      const current = mode === 'follow' ? followFile : newFile;
      if (current !== file) return;
      if (mode === 'follow') {
        if (shrunk !== file) followFile = shrunk;
        followThumb = thumb;
      } else {
        if (shrunk !== file) newFile = shrunk;
        newThumb = thumb;
      }
    }).catch(() => { /* 原本のまま・サムネ無し */ });

    const reader = new FileReader();
    reader.onload = (e) => {
      preview.innerHTML = `<img src="${e.target.result}" alt="preview"><button class="photo-remove">✕</button>`;
      preview.querySelector('.photo-remove').addEventListener('click', () => {
        // ⚠ サムネも一緒に捨てる。残すと次の写真に**前の写真のサムネ**が付く。
        if (mode === 'follow') { followFile = null; followThumb = null; }
        else { newFile = null; newThumb = null; }
        cameraInput.value = '';
        galleryInput.value = '';
        preview.innerHTML = mode === 'follow' ? 'After写真を撮影または選択' : '写真を撮影または選択';
        if (mode === 'follow') updateFollowSendBtn();
        else updateNewSendBtn();
      });
    };
    reader.readAsDataURL(file);
    if (mode === 'follow') updateFollowSendBtn();
    else updateNewSendBtn();
  }

  function showStatusEl(el, msg, type) {
    el.className = `status status-${type}`;
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // 端末TZに依存せず JST(UTC+9) の壁時計を返す(M-6)。patrol_date 等の「暦日」は
  // 業務TZ(JST)基準で確定する必要がある。端末TZズレや、月末深夜に端末TZでは翌日/
  // 翌月へ転がってしまうズレ(月境界ズレ)を防ぐ。UTC ミリ秒に +9h して getUTC* で読む。
  // ※ createdAt/followed_at は toISOString() の UTC 絶対時刻なので TZ 非依存(変更不要)。
  function jstNow() { return new Date(Date.now() + 9 * 3600 * 1000); }
  function jstDateStr() {
    const d = jstNow();
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  }
  function jstMonthStr(offsetMonths) {
    const d = jstNow();
    const base = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + (offsetMonths || 0), 1));
    return `${base.getUTCFullYear()}-${String(base.getUTCMonth() + 1).padStart(2, '0')}`;
  }

  // すべての let/const/function 定義が初期化された後に起動する(TDZ 回避)。
  // init が万一 throw しても無音で全ボタン死にしないよう捕捉し、可視のエラーを出す
  // (今回の TDZ 障害は init 中断が無音で発見が遅れた。同種の再発を早期発見するため)。
  try {
    init();
  } catch (e) {
    console.error('[safety-patrol] init failed:', e);
    const w = document.getElementById('idbWarning');
    if (w) { w.textContent = '⚠️ ページの初期化に失敗しました。再読み込みしてください'; w.classList.remove('hidden'); }
  }
})();
</script>
</body>
